name: security - secret scan

on:
  pull_request:
    branches: [ "develop" ]
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for better detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PR: escanea cambios entre base y head
      - name: TruffleHog (PR diff scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown --only-verified=false --json

      # Push: escanea la rama completa (POC: simple)
      - name: TruffleHog (push scan)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@v3.92.4
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --only-verified=false --json

      - name: Save report
        if: always()
        run: |
          echo "TruffleHog executed for event: ${{ github.event_name }}" > secret-scan-report.txt
          echo "Ref: ${{ github.ref }}" >> secret-scan-report.txt
          echo "If secrets are found, TruffleHog would fail / show matches in logs." >> secret-scan-report.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: secret-scan-report.txt
