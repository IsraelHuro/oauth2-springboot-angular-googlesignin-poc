name: security-secrets

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan (fail + report)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch remote branches (needed for base refs)
        run: |
          git fetch --prune --tags origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Decide base ref
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_REF=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE_REF=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
          fi

      - name: Run TruffleHog (docker) + write report
        id: scan
        run: |
          set -euo pipefail

          # Asegura que los ficheros existen para poder subir artifacts incluso si todo va perfecto
          : > trufflehog-report.json
          : > trufflehog-summary.txt

          echo "Base ref: $BASE_REF" | tee -a trufflehog-summary.txt
          echo "Branch:   HEAD"      | tee -a trufflehog-summary.txt
          echo ""                  | tee -a trufflehog-summary.txt

          # Ejecutamos sin cortar el job para poder subir artifacts siempre
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/trufflesecurity/trufflehog:latest \
              git file:///repo \
              --since-commit "$BASE_REF" \
              --branch HEAD \
              --results=verified,unknown \
              --json \
            > trufflehog-report.json
          RC=$?
          set -e

          echo "trufflehog_exit_code=$RC" | tee -a trufflehog-summary.txt

          FINDINGS_LINES=$(wc -l < trufflehog-report.json | tr -d ' ')
          echo "findings_lines=$FINDINGS_LINES" | tee -a trufflehog-summary.txt

          if [ "$FINDINGS_LINES" -gt 0 ]; then
            echo "FINDINGS=true" >> "$GITHUB_ENV"
            echo "Result: ❌ findings detected" | tee -a trufflehog-summary.txt
          else
            echo "FINDINGS=false" >> "$GITHUB_ENV"
            echo "Result: ✅ no findings" | tee -a trufflehog-summary.txt
          fi

      - name: Upload TruffleHog report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-trufflehog
          path: |
            trufflehog-report.json
            trufflehog-summary.txt
          if-no-files-found: error

      - name: Fail workflow if secrets were found
        if: always()
        run: |
          if [ "$FINDINGS" = "true" ]; then
            echo "Secrets/leaks detected by TruffleHog. Failing the job."
            exit 1
          fi
