name: quality

on:
  pull_request:
    branches: [ "develop" ]
  push:
    branches: [ "**" ]

jobs:
  backend-authorization:
    name: authorization-server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Maven test (retry)
        run: |
          set -e
          for i in 1 2 3; do
            echo "Attempt $i/3"
            ./mvnw -B -ntp test && break
            if [ "$i" -eq 3 ]; then
              echo "Maven failed after 3 attempts"
              exit 1
            fi
            echo "Retrying in 15s..."
            sleep 15
          done

  backend-resource:
    name: resource-server (tests + show surefire error)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resource-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Maven repo
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Maven test (retry + dump surefire on failure)
        run: |
          set +e
          exit_code=1

          for i in 1 2 3; do
            echo "Attempt $i/3"
            ./mvnw -B -ntp -e -DtrimStackTrace=false test
            exit_code=$?

            if [ "$exit_code" -eq 0 ]; then
              echo "Maven test OK"
              exit 0
            fi

            echo "Attempt $i failed with exit code $exit_code"
            if [ "$i" -lt 3 ]; then
              echo "Retrying in 15s..."
              sleep 15
            fi
          done

          echo "==== SUREFIRE REPORTS (resource-server) ===="
          ls -la target/surefire-reports || true
          for f in target/surefire-reports/*.txt target/surefire-reports/*.dumpstream target/surefire-reports/*.xml; do
            if [ -f "$f" ]; then
              echo "---- $f ----"
              sed -n '1,220p' "$f"
            fi
          done

          exit $exit_code

  frontend-lint:
    name: ag-prueba-front (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-prueba-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Install deps (ci if possible, fallback to install)
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
