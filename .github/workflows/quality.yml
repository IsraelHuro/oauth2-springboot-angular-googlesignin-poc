name: quality

on:
  pull_request:
    branches: [ "develop" ]
  push:
    branches: [ "**" ]

jobs:
  backend-authorization-quality:
    name: authorization-server (checkstyle + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Test + Coverage (JaCoCo) + Checkstyle
        run: ./mvnw test

      - name: Upload JaCoCo report (authorization-server)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-authorization-server
          path: authorization-server/target/site/jacoco/

  backend-resource-quality:
    name: resource-server (checkstyle + tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resource-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Test + Coverage (JaCoCo) + Checkstyle
        run: ./mvnw test

      - name: Upload JaCoCo report (resource-server)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-resource-server
          path: resource-server/target/site/jacoco/

  frontend-lint:
    name: ag-prueba-front (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-prueba-front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint
