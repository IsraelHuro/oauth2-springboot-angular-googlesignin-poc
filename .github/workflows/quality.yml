name: quality

on:
  pull_request:
    branches: ["develop"]
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend-authorization:
    name: authorization-server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: authorization-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Tests (incluye JaCoCo + Checkstyle en validate)
        run: ./mvnw -B test

      - name: Generate Checkstyle HTML report
        run: ./mvnw -B checkstyle:checkstyle

      - name: Upload JaCoCo report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-server-jacoco
          path: authorization-server/target/site/jacoco/**
          if-no-files-found: warn

      - name: Upload Checkstyle report (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-server-checkstyle
          path: |
            authorization-server/target/site/checkstyle*
            authorization-server/target/checkstyle-result.xml
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-server-surefire
          path: authorization-server/target/surefire-reports/**
          if-no-files-found: warn

  backend-resource:
    name: resource-server (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resource-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Prepare Maven Wrapper
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw

      - name: Tests (incluye JaCoCo + Checkstyle en validate)
        run: ./mvnw -B test

      - name: Generate Checkstyle HTML report
        run: ./mvnw -B checkstyle:checkstyle

      - name: Upload JaCoCo report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-jacoco
          path: resource-server/target/site/jacoco/**
          if-no-files-found: warn

      - name: Upload Checkstyle report (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-checkstyle
          path: |
            resource-server/target/site/checkstyle*
            resource-server/target/checkstyle-result.xml
          if-no-files-found: warn

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-server-surefire
          path: resource-server/target/surefire-reports/**
          if-no-files-found: warn

  frontend-lint:
    name: ag-prueba-front (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ag-prueba-front

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ag-prueba-front/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
