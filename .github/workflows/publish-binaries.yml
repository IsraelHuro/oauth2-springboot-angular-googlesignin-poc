name: publish-binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión/tag a publicar (ej: poc-okr4 o v0.4.0)"
        required: true
        default: "poc-okr4"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION and OWNER (lowercase)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          OWNER="${{ github.repository_owner }}"
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "OWNER_LC=$OWNER_LC" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push authorization-server
        run: |
          docker build -t $REGISTRY/$OWNER_LC/authorization-server:$VERSION authorization-server
          docker push $REGISTRY/$OWNER_LC/authorization-server:$VERSION

      - name: Build & Push resource-server
        run: |
          docker build -t $REGISTRY/$OWNER_LC/resource-server:$VERSION resource-server
          docker push $REGISTRY/$OWNER_LC/resource-server:$VERSION

      - name: Build & Push ag-prueba-front
        run: |
          docker build -t $REGISTRY/$OWNER_LC/ag-prueba-front:$VERSION ag-prueba-front
          docker push $REGISTRY/$OWNER_LC/ag-prueba-front:$VERSION

      # Evidencia extra (listado de imágenes)
      - name: Generate evidence files
        if: always()
        run: |
          echo "Published version: $VERSION" > published-images.txt
          echo "Registry: $REGISTRY" >> published-images.txt
          echo "Owner: $OWNER_LC" >> published-images.txt
          echo "" >> published-images.txt
          echo "Images:" >> published-images.txt
          echo "$REGISTRY/$OWNER_LC/authorization-server:$VERSION" >> published-images.txt
          echo "$REGISTRY/$OWNER_LC/resource-server:$VERSION" >> published-images.txt
          echo "$REGISTRY/$OWNER_LC/ag-prueba-front:$VERSION" >> published-images.txt

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binaries-versioned-evidence
          path: |
            published-images.txt
          if-no-files-found: ignore
