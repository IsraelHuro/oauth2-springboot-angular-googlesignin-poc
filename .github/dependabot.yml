version: 2
updates:
  # GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # Maven - authorization-server
  - package-ecosystem: "maven"
    directory: "/authorization-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 5
    groups:
      maven-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # Si quieres evitar majors:
    # ignore:
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-major"]

  # Maven - resource-server
  - package-ecosystem: "maven"
    directory: "/resource-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 5
    groups:
      maven-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # ignore:
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-major"]

  # NPM - frontend
  - package-ecosystem: "npm"
    directory: "/ag-prueba-front"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    versioning-strategy: "auto"
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    # ignore:
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-major"]
