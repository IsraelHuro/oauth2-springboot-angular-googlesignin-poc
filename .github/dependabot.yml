version: 2
updates:
  # GitHub Actions (workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  # Maven - authorization-server
  - package-ecosystem: "maven"
    directory: "/authorization-server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 5
    groups:
      maven-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # Maven - resource-server
  - package-ecosystem: "maven"
    directory: "/resource-server"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "maven"
    open-pull-requests-limit: 5
    groups:
      maven-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]

  # NPM - frontend
  - package-ecosystem: "npm"
    directory: "/ag-prueba-front"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    groups:
      npm-patches:
        patterns: ["*"]
        update-types: ["patch", "minor"]
