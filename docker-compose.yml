version: "3.9"

services:
  db:
    image: "${MYSQL_IMAGE:-mysql:8}"
    container_name: aghairsalon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aghairsalon}
      MYSQL_USER: ${MYSQL_USER:-aghairsalon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aghairsalon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  authorization-server:
    image: "${REGISTRY:-ghcr.io}/${GHCR_OWNER:-local}/authorization-server:${TAG:-local}"
    build: ./authorization-server
    container_name: authorization-server
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:mysql://db:3306/aghairsalon}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER:-aghairsalon}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-aghairsalon}

      # Actuator + Prometheus (asegura exposición)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      # Mejora rápida API (menos overhead + compresión)
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: "INFO"
      SERVER_COMPRESSION_ENABLED: "true"
      SERVER_COMPRESSION_MIN_RESPONSE_SIZE: "1024"
      SERVER_COMPRESSION_MIME_TYPES: "application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript"
    ports:
      - "9000:9000"

  resource-server:
    image: "${REGISTRY:-ghcr.io}/${GHCR_OWNER:-local}/resource-server:${TAG:-local}"
    build: ./resource-server
    container_name: resource-server
    depends_on:
      - authorization-server
      - db
    environment:
      SPRING_DATASOURCE_URL: ${RES_DB_URL:-jdbc:mysql://db:3306/aghairsalon}
      SPRING_DATASOURCE_USERNAME: ${RES_DB_USER:-aghairsalon}
      SPRING_DATASOURCE_PASSWORD: ${RES_DB_PASSWORD:-aghairsalon}

      # Actuator + Prometheus
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      # Mejora rápida API
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_OAUTH2: "INFO"
      SERVER_COMPRESSION_ENABLED: "true"
      SERVER_COMPRESSION_MIN_RESPONSE_SIZE: "1024"
      SERVER_COMPRESSION_MIME_TYPES: "application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript"
    ports:
      - "8081:8081"

  frontend:
    image: "${REGISTRY:-ghcr.io}/${GHCR_OWNER:-local}/ag-prueba-front:${TAG:-local}"
    build: ./ag-prueba-front
    container_name: aghairsalon-front
    depends_on:
      - resource-server
    ports:
      - "4200:80"
    environment:
      API_URL: ${API_URL:-http://resource-server:8081}

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - authorization-server
      - resource-server
      - blackbox-exporter

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db-data:
  prometheus-data:
  grafana-data:
