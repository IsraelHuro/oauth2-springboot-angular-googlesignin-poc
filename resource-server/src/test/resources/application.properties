# --- DB en memoria para tests ---
spring.datasource.url=jdbc:h2:mem:resdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# --- evita problemas con keywords tipo "value" ---
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# --- dummy (por si algo lo lee, pero con @Profile("!test") ni se usa) ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://dummy
