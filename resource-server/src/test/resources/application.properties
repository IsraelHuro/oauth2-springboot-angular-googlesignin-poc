# --- DB en memoria para tests ---
spring.datasource.url=jdbc:h2:mem:resdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# --- dummy JWT config (evita fallo al arrancar el contexto) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/jwks.json

# --- fix H2 reserved keywords like "value" ---
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
